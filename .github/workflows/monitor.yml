name: Eslite Beyblade Telegram Test

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Send Telegram test notification'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Test Telegram
        if: ${{ inputs.test_telegram == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is empty or missing"
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID secret is empty or missing"
            exit 1
          fi

          HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            --data "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"🧪 誠品戰鬥陀螺 Telegram 測試成功\",\"disable_web_page_preview\":true}")

          echo "Telegram HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Telegram test failed"
            exit 1
          fi
          echo "Telegram test successful"
